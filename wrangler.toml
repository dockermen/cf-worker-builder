name = "cf-worker-builder"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 自定义域（解决 workers.dev 在大陆无法直连的问题）
routes = [
  { pattern = "worker.logg.click", custom_domain = true }
]

# 前端静态资源
assets = { directory = "./public", binding = "ASSETS" }

# 数据存储（项目、对话历史、LLM 配置、Cloudflare 登录态）
# 本地开发可直接使用占位 id；部署前请执行:
#   npx wrangler kv namespace create BUILDER_KV
# 并把返回的 id 填到下面
[[kv_namespaces]]
binding = "BUILDER_KV"
id = "85cc45333eb8456aab2888a3d89e9954"

# [vars]
# OAUTH_CLIENT_ID = "自建 Cloudflare OAuth 客户端 ID（可选，默认复用 wrangler 官方客户端，零配置在线登录）"
