name = "cf-worker-builder"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 前端静态资源
assets = { directory = "./public", binding = "ASSETS" }

# 数据存储（项目、对话历史、LLM 配置、Cloudflare 登录态）
# 本地开发无需修改即可运行；部署前请执行:
#   npx wrangler kv namespace create BUILDER_KV
# 并把返回的 id 填到下面
[[kv_namespaces]]
binding = "BUILDER_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# [vars]
# OAUTH_CLIENT_ID = "自建 Cloudflare OAuth 客户端 ID（可选，默认复用 Cloudflare 官方 wrangler 客户端，零配置在线登录）"

# 自定义域路由（可选，把 example.com 换成你的域名，解决部分地区无法直连 workers.dev 的问题）
# routes = [
#   { pattern = "builder.example.com", custom_domain = true }
# ]
