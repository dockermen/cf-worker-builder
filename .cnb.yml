# CNB 云原生构建流水线（cnb.cool）
#
# 由构建器（Worker 在线构建器）通过 OPENAPI 触发：
#   POST https://api.cnb.cool/{repo}/-/build/start
#   {"event": "api_trigger_builder", "branch": "main", "env": {"TASK_ID": "...", "TASK_TOKEN": "...", "BUILDER_BASE_URL": "..."}}
#
# 重要：api_trigger 事件必须配置在【分支块】下（main: / $:），不能放在顶层。
# runner（agent-runner/run.js）在 node:20 容器中执行完整的
# 「LLM 生成 → 工具调用 → 部署 → 冒烟测试」Agent 循环，无 Workers 长连接超时限制，
# 结果通过回调写回构建器。
#
# 可选环境变量：
#   CNB_PROXY_SUB  Clash 代理订阅地址（构建器设置里配置）。提供后本流水线会：
#                  ① 安装 mihomo（Clash Meta 内核）；② 下载订阅生成配置（自动补 mixed-port: 7890）；
#                  ③ 启动本地代理并设置 CLASH_PROXY=http://127.0.0.1:7890。
#                  用于解决 CNB 容器（大陆）访问 Cloudflare / workers.dev 网络不通的问题。
#
# 注意：仓库需在 cnb.cool「仓库设置 → 云原生构建」中勾选「允许自动触发」。

main:
  api_trigger_builder:
    - docker:
        image: node:20
        volumes:
          - /root/.npm:copy-on-write
      stages:
        - |
          set -e
          echo "== 准备环境 =="
          apt-get update -qq >/dev/null 2>&1 || true
          apt-get install -y -qq curl gzip ca-certificates >/dev/null 2>&1 || true
          # undici：Clash 代理下 Node fetch 需要 ProxyAgent
          npm i undici --no-save --no-package-lock --silent >/dev/null 2>&1 || true

          # ===== Clash 代理（可选，CNB_PROXY_SUB 由构建器设置传入） =====
          # 关键：代理必须真实可用才 export CLASH_PROXY，否则降级直连，
          # 避免「假启动」导致 runner 全部 ECONNREFUSED。
          if [ -n "$CNB_PROXY_SUB" ]; then
            echo "== 检测到代理订阅，准备 Clash（mihomo） =="
            # 1) 下载 mihomo（仅一次）
            if [ ! -x /tmp/mihomo ]; then
              if curl -sL --max-time 120 "https://github.com/MetaCubeX/mihomo/releases/download/v1.18.10/mihomo-linux-amd64-v1.18.10.gz" -o /tmp/mihomo.gz \
                  && gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo; then
                echo "mihomo 已安装: $(/tmp/mihomo -v 2>/dev/null | head -1 || echo ok)"
              else
                echo "!! mihomo 下载失败，跳过代理（将直连）"
              fi
            fi
            # 2) 下载订阅并生成 mihomo 配置（标准 yaml 直接用；vless/vmess/hy2 等 URI 订阅自动转换）
            if [ -x /tmp/mihomo ] && curl -sL --max-time 120 "$CNB_PROXY_SUB" -o /tmp/sub_raw && [ -s /tmp/sub_raw ]; then
              echo "订阅已下载（$(wc -c < /tmp/sub_raw) 字节）"
              if head -1 /tmp/sub_raw | grep -qE '^(proxies|mixed-port|port|proxy-groups)'; then
                cp /tmp/sub_raw /tmp/clash-config.yaml
              else
                node agent-runner/sub2clash.js /tmp/sub_raw > /tmp/clash-config.yaml 2>/tmp/sub2clash.log || echo "!! 订阅转换失败（详见 /tmp/sub2clash.log）"
              fi
              # 3) 必须包含 proxies 节点，补 mixed-port 后启动
              if grep -q '^proxies:' /tmp/clash-config.yaml; then
                grep -q '^mixed-port:' /tmp/clash-config.yaml || sed -i '1i mixed-port: 7890' /tmp/clash-config.yaml
                mkdir -p /tmp/clash && cp /tmp/clash-config.yaml /tmp/clash/config.yaml
                /tmp/mihomo -d /tmp/clash >/tmp/clash.log 2>&1 &
                sleep 6
                # 4) 验证 mihomo 已在 7890 监听（仅查监听，不要求节点立刻连通；
                #    节点可用性交给 url-test 组自动选择 + runner 健康检查兜底降级）
                PORT_OK=0
                if command -v nc >/dev/null 2>&1 && nc -z 127.0.0.1 7890 2>/dev/null; then
                  PORT_OK=1
                elif grep -qiE ':(CA1E|ca1e) ' /proc/net/tcp 2>/dev/null; then
                  PORT_OK=1
                elif command -v ss >/dev/null 2>&1 && ss -ltn 2>/dev/null | grep -q ':7890'; then
                  PORT_OK=1
                fi
                if [ "$PORT_OK" = "1" ]; then
                  export CLASH_PROXY=http://127.0.0.1:7890
                  echo "== Clash 代理已启动（mihomo 监听 7890）：$CLASH_PROXY =="
                else
                  echo "!! Clash 代理启动失败（7890 未监听），降级直连。mihomo 日志："
                  tail -20 /tmp/clash.log 2>/dev/null || true
                  unset CLASH_PROXY
                fi
              else
                echo "!! 生成的配置缺少 proxies 节点，无法使用，跳过代理（将直连）"
                cat /tmp/sub2clash.log 2>/dev/null || true
              fi
            else
              echo "!! 订阅下载失败或为空，跳过代理（将直连）"
            fi
          fi

          echo "== 执行构建器 Agent 任务 =="
          node agent-runner/run.js
